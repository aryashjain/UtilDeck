name = "utildeck"
main = "packages/worker/src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Serve the static site from the same Worker, so /api and the pages share one origin
[assets]
directory = "packages/web/src"
binding = "ASSETS"

# Shared notes storage. Create it with: npx wrangler kv namespace create NOTES
# then paste the returned ids below.
[[kv_namespaces]]
binding = "NOTES"
id = "396ff6507ee64d74909892b56329118e"
preview_id = "396ff6507ee64d74909892b56329118e"

# Worker logs and invocation logs, as set in the dashboard
[observability.logs]
enabled = false
invocation_logs = true
