<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Remover - UtilDeck</title>
  <link rel="icon" type="image/png" href="../assets/light-icon64.png">
  <link rel="apple-touch-icon" href="../assets/light-icon180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="brand">
        <img class="brand-logo" src="../assets/light-icon64.png" alt="" width="36" height="36">
        <div class="brand-text">
          <h1>UtilDeck</h1>
          <span class="brand-tagline">Your everyday toolkit</span>
        </div>
      </div>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <nav class="tool-nav" id="toolNav"></nav>

  <main class="container">
    <section class="editor-section">
      <h2>Extra Space & Line Break Remover</h2>
      <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
        Remove extra spaces, line breaks, and clean up your text formatting.
      </p>

      <div class="split-layout">
        <div class="split-input">
          <div class="split-input-pair">
            <label for="textInput">Text Input</label>
            <textarea id="textInput" placeholder="Paste your text here..."></textarea>
          </div>
        </div>

        <div class="split-output">
          <h3 style="margin: 0;">Cleaning Options</h3>
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; flex: 0; margin-bottom: 1rem;">
            <button class="btn btn-secondary" id="removeExtraSpaces">Remove Extra Spaces</button>
            <button class="btn btn-secondary" id="removeLineBreaks">Remove Line Breaks</button>
            <button class="btn btn-secondary" id="trimLines">Trim Lines</button>
            <button class="btn btn-secondary" id="removeBlankLines">Remove Blank Lines</button>
            <button class="btn btn-secondary" id="singleSpaces">Single Spaces</button>
            <button class="btn btn-secondary" id="cleanAll">Clean All</button>
          </div>

          <div style="display: flex; gap: 1rem; align-items: center; margin: 1rem 0 0.75rem 0;">
            <h3 style="margin: 0; flex: 1;">Result</h3>
            <div style="display: flex; gap: 0.5rem;">
              <button id="copyBtn" class="btn btn-secondary">Copy</button>
              <button id="clearBtn" class="btn btn-secondary">Clear</button>
            </div>
          </div>
          <textarea id="result" placeholder="Cleaned text will appear here..." readonly style="flex: 1; min-height: 0;"></textarea>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-made">Made with <span aria-label="love">❤️</span> by <strong>Aryash</strong></p>
      <div class="footer-links">
        <a href="https://x.com/Aaryash747" target="_blank" rel="noopener">@Aaryash747</a>
        <a href="mailto:aryashjain747@gmail.com">aryashjain747@gmail.com</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { initNav } from '../scripts/nav.js';
    initNav();
    import { initTheme } from '../scripts/utils.js';

    const textInput = document.getElementById('textInput');
    const result = document.getElementById('result');
    const themeToggle = document.getElementById('themeToggle');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');

    initTheme(themeToggle);

    const operations = {
      removeExtraSpaces: (text) => text.replace(/ +/g, ' '),
      removeLineBreaks: (text) => text.replace(/\n/g, ' ').replace(/ +/g, ' '),
      trimLines: (text) => text.split('\n').map(line => line.trim()).join('\n'),
      removeBlankLines: (text) => text.split('\n').filter(line => line.trim()).join('\n'),
      singleSpaces: (text) => text.replace(/ +/g, ' ').trim(),
      cleanAll: (text) => {
        return text
          .replace(/ +/g, ' ')
          .split('\n')
          .map(line => line.trim())
          .filter(line => line)
          .join('\n')
          .trim();
      },
    };

    Object.entries(operations).forEach(([id, fn]) => {
      const btn = document.getElementById(id);
      if (btn) {
        btn.addEventListener('click', () => {
          result.value = fn(textInput.value);
        });
      }
    });

    copyBtn.addEventListener('click', () => {
      if (!result.value) {
        copyBtn.textContent = 'Nothing to copy';
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
        }, 2000);
        return;
      }
      navigator.clipboard.writeText(result.value).then(() => {
        const originalText = 'Copy';
        copyBtn.textContent = '✓ Copied';
        setTimeout(() => {
          copyBtn.textContent = originalText;
        }, 2000);
      }).catch(err => {
        console.error('Copy failed:', err);
        copyBtn.textContent = 'Copy failed';
        setTimeout(() => copyBtn.textContent = 'Copy', 2000);
      });
    });

    clearBtn.addEventListener('click', () => {
      textInput.value = '';
      result.value = '';
    });
  </script>
</body>
</html>
