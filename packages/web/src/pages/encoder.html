<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Encode and decode Base64, URL and HTML entities. Free, and it runs in your browser.">
  <meta name="keywords" content="UtilDeck, Encoder, free online tool, runs in browser, base64, url, html entities, escape, decode, encode">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://utildeck.bot747.workers.dev/pages/encoder.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="UtilDeck">
  <meta property="og:title" content="Encoder - Free Online Tool | UtilDeck">
  <meta property="og:description" content="Encode and decode Base64, URL and HTML entities. Free, and it runs in your browser.">
  <meta property="og:url" content="https://utildeck.bot747.workers.dev/pages/encoder.html">
  <meta property="og:image" content="https://utildeck.bot747.workers.dev/assets/light-icon180.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Encoder - Free Online Tool | UtilDeck">
  <meta name="twitter:description" content="Encode and decode Base64, URL and HTML entities. Free, and it runs in your browser.">
  <title>Encoder - Free Online Tool | UtilDeck</title>
  <link rel="icon" type="image/png" href="../assets/light-icon64.png">
  <link rel="apple-touch-icon" href="../assets/light-icon180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="brand">
        <img class="brand-logo" src="../assets/light-icon64.png" alt="" width="36" height="36">
        <div class="brand-text">
          <h1>UtilDeck</h1>
          <span class="brand-tagline">Your everyday toolkit</span>
        </div>
      </div>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <nav class="tool-nav" id="toolNav"></nav>

  <main class="container">
    <section class="editor-section">
      <h2>Encoder / Decoder</h2>
      <p class="tool-description">
        Convert text to and from Base64, URL encoding (percent-encoding) and HTML entities. Pick a format, then encode or decode.
      </p>

      <div class="split-layout">
        <div class="split-input">
          <div class="split-input-pair">
            <label for="input">Input</label>
            <textarea id="input" placeholder="Paste text to encode or decode..."></textarea>
          </div>
        </div>

        <div class="split-output">
          <div class="control-row">
            <div class="field">
              <label for="format">Format</label>
              <select id="format" class="text-input">
                <option value="base64">Base64</option>
                <option value="url">URL (percent-encoding)</option>
                <option value="html">HTML entities</option>
              </select>
            </div>
            <div class="segmented" role="group" aria-label="Direction">
              <button class="btn btn-secondary active" data-direction="encode">Encode</button>
              <button class="btn btn-secondary" data-direction="decode">Decode</button>
            </div>
          </div>

          <p id="status" class="status" aria-live="polite"></p>

          <div class="output-header">
            <h3>Result</h3>
            <div class="output-actions">
              <button id="useResultBtn" class="btn btn-secondary">Use as input</button>
              <button id="copyBtn" class="btn btn-secondary">Copy</button>
            </div>
          </div>
          <textarea id="output" placeholder="The result will appear here..." readonly style="flex: 1; min-height: 0;"></textarea>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-made">Made with <span aria-label="love">❤️</span> by <strong>Aryash</strong></p>
      <div class="footer-links">
        <a href="https://x.com/Aaryash747" target="_blank" rel="noopener">@Aaryash747</a>
        <a href="mailto:aryashjain747@gmail.com">aryashjain747@gmail.com</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { initTheme, copyText } from '../scripts/utils.js';
    import { initNav } from '../scripts/nav.js';

    initNav();

    const themeToggle = document.getElementById('themeToggle');
    const input = document.getElementById('input');
    const format = document.getElementById('format');
    const status = document.getElementById('status');
    const output = document.getElementById('output');
    const useResultBtn = document.getElementById('useResultBtn');
    const copyBtn = document.getElementById('copyBtn');
    const directionButtons = document.querySelectorAll('[data-direction]');

    let direction = 'encode';

    initTheme(themeToggle);

    const converters = {
      base64: {
        encode: text => {
          const bytes = new TextEncoder().encode(text);
          let binary = '';
          for (const byte of bytes) binary += String.fromCharCode(byte);
          return btoa(binary);
        },
        decode: text => {
          const binary = atob(text.trim());
          const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
          return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        },
      },
      url: {
        encode: text => encodeURIComponent(text),
        decode: text => decodeURIComponent(text),
      },
      html: {
        encode: text => text.replace(/[&<>"']/g, char => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        })[char]),
        // DOMParser doesn't run scripts or load images, unlike setting innerHTML
        decode: text => new DOMParser().parseFromString(text, 'text/html').documentElement.textContent,
      },
    };

    function update() {
      const text = input.value;
      if (!text) {
        output.value = '';
        status.textContent = '';
        status.classList.remove('error');
        return;
      }

      try {
        output.value = converters[format.value][direction](text);
        status.textContent = '';
        status.classList.remove('error');
      } catch (err) {
        output.value = '';
        status.textContent = `Could not ${direction} this input: ${err.message}`;
        status.classList.add('error');
      }
    }

    directionButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        direction = btn.dataset.direction;
        directionButtons.forEach(b => b.classList.toggle('active', b === btn));
        update();
      });
    });

    input.addEventListener('input', update);
    format.addEventListener('change', update);

    useResultBtn.addEventListener('click', () => {
      input.value = output.value;
      update();
    });

    copyBtn.addEventListener('click', () => copyText(output.value, copyBtn));
  </script>
</body>
</html>
