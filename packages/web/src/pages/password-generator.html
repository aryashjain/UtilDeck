<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator - UtilDeck</title>
  <link rel="icon" type="image/png" href="../assets/icon-64.png">
  <link rel="apple-touch-icon" href="../assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="brand">
        <img class="brand-logo" src="../assets/icon-64.png" alt="" width="36" height="36">
        <div class="brand-text">
          <h1>UtilDeck</h1>
          <span class="brand-tagline">Your everyday toolkit</span>
        </div>
      </div>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <nav class="tool-nav" id="toolNav"></nav>

  <main class="container">
    <section class="editor-section">
      <h2>Password Generator</h2>
      <p class="tool-description">
        Generate random passwords with your browser’s secure random source. Nothing is sent anywhere, and the passwords are never stored.
      </p>

      <div class="control-panel">
        <div class="field">
          <label for="length">Length: <strong id="lengthValue">16</strong></label>
          <input type="range" id="length" min="4" max="128" value="16">
        </div>

        <div class="field">
          <label for="count">How many</label>
          <input type="number" id="count" class="text-input" min="1" max="20" value="5">
        </div>

        <div class="control-row control-row-full">
          <label class="checkbox-option"><input type="checkbox" id="upper" checked> Uppercase (A–Z)</label>
          <label class="checkbox-option"><input type="checkbox" id="lower" checked> Lowercase (a–z)</label>
          <label class="checkbox-option"><input type="checkbox" id="numbers" checked> Numbers (0–9)</label>
          <label class="checkbox-option"><input type="checkbox" id="symbols" checked> Symbols</label>
          <label class="checkbox-option"><input type="checkbox" id="noAmbiguous"> Skip look-alikes (0 O 1 l I)</label>
        </div>

        <div class="control-row control-row-full">
          <button id="generateBtn" class="btn btn-primary">Generate</button>
        </div>
      </div>

      <p id="status" class="status" aria-live="polite"></p>

      <div class="output-header">
        <h3>Passwords</h3>
        <div class="output-actions">
          <button id="copyBtn" class="btn btn-secondary">Copy</button>
        </div>
      </div>
      <textarea id="output" class="output-box" placeholder="Your passwords will appear here..." readonly spellcheck="false"></textarea>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-made">Made with <span aria-label="love">❤️</span> by <strong>Aryash</strong></p>
      <div class="footer-links">
        <a href="https://x.com/Aaryash747" target="_blank" rel="noopener">@Aaryash747</a>
        <a href="mailto:aryashjain747@gmail.com">aryashjain747@gmail.com</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { initTheme, copyText } from '../scripts/utils.js';
    import { initNav } from '../scripts/nav.js';

    initNav();

    const themeToggle = document.getElementById('themeToggle');
    const lengthInput = document.getElementById('length');
    const lengthValue = document.getElementById('lengthValue');
    const countInput = document.getElementById('count');
    const noAmbiguous = document.getElementById('noAmbiguous');
    const status = document.getElementById('status');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');
    const generateBtn = document.getElementById('generateBtn');

    const CHARACTER_SETS = [
      { id: 'upper', chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' },
      { id: 'lower', chars: 'abcdefghijklmnopqrstuvwxyz' },
      { id: 'numbers', chars: '0123456789' },
      { id: 'symbols', chars: '!@#$%^&*()-_=+[]{};:,.<>?/' },
    ];
    const AMBIGUOUS = /[0O1lI]/g;

    initTheme(themeToggle);

    // Uniform random integer in [0, max) using rejection sampling, so no value is favored
    function randomInt(max) {
      const limit = Math.floor(0x100000000 / max) * max;
      const buffer = new Uint32Array(1);
      let value;
      do {
        crypto.getRandomValues(buffer);
        value = buffer[0];
      } while (value >= limit);
      return value % max;
    }

    function strengthLabel(bits) {
      if (bits < 40) return 'Weak';
      if (bits < 60) return 'Fair';
      if (bits < 80) return 'Good';
      return 'Strong';
    }

    function generatePassword(length, sets) {
      const pool = sets.join('');
      // One character from every selected set guarantees each type appears
      const chars = sets.map(set => set[randomInt(set.length)]);
      while (chars.length < length) chars.push(pool[randomInt(pool.length)]);

      // Shuffle so the guaranteed characters don't always sit at the front
      for (let i = chars.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [chars[i], chars[j]] = [chars[j], chars[i]];
      }
      return chars.join('');
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function generate() {
      const length = Number(lengthInput.value);
      const count = Math.min(20, Math.max(1, Number(countInput.value) || 1));
      const sets = CHARACTER_SETS
        .filter(set => document.getElementById(set.id).checked)
        .map(set => noAmbiguous.checked ? set.chars.replace(AMBIGUOUS, '') : set.chars);

      if (sets.length === 0) {
        output.value = '';
        setStatus('Pick at least one character type.', true);
        return;
      }
      if (length < sets.length) {
        output.value = '';
        setStatus(`Use a length of at least ${sets.length} to include every selected type.`, true);
        return;
      }

      const pool = sets.join('');
      const bits = length * Math.log2(pool.length);
      const passwords = Array.from({ length: count }, () => generatePassword(length, sets));

      output.value = passwords.join('\n');
      setStatus(`Strength: ${strengthLabel(bits)} (about ${Math.round(bits)} bits of entropy)`);
    }

    lengthInput.addEventListener('input', () => {
      lengthValue.textContent = lengthInput.value;
      generate();
    });
    countInput.addEventListener('input', generate);
    document.querySelectorAll('input[type="checkbox"]').forEach(el => el.addEventListener('change', generate));
    generateBtn.addEventListener('click', generate);

    copyBtn.addEventListener('click', () => copyText(output.value, copyBtn));

    generate();
  </script>
</body>
</html>
